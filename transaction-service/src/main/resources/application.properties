spring.application.name=transaction-service

server.servlet.context-path=/transaction/api/v1
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5401}/${DB_NAME:transaction_db}
spring.datasource.username=${DB_USERNAME:transaction_user}
spring.datasource.password=${DB_PASSWORD:transaction_password}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000