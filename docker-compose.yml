services:
  postgres:
    image: postgres:17-alpine
    container_name: account_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_password

    ports:
      - "5400:5432"

    volumes:
      - account_postgres:/var/lib/postgresql/data

volumes:
  account_postgres: